[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boston-sports-buddy"
version = "0.1.0"
description = "Agentic Boston sports news monitor and digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",         # Pretty console output
    "schedule>=1.2.2",      # Cron-style scheduler
    # LLM provider — install at least one:
    "anthropic>=0.40.0",   # default; swap for openai below if preferred
]

[project.optional-dependencies]
openai = [
    "openai>=1.50.0",
]
slack = [
    "slack-sdk>=3.33.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
boston-buddy = "src.agent.buddy:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
