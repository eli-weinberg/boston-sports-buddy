teams:
  - celtics
  - bruins
  - red_sox
  - patriots
  - revolution

# How many minutes between monitoring runs (daemon mode)
schedule:
  interval_minutes: 30

# ── Sources ────────────────────────────────────────────────────────────────
sources:
  rss:
    enabled: true
    # Omit `feeds` to use the full DEFAULT_FEEDS catalog in rss.py (recommended).
    # Uncomment and list specific feeds to override:
    # feeds:
    #   - https://www.espn.com/espn/rss/nba/news

  reddit:
    enabled: false   # set to true after adding REDDIT_CLIENT_ID/SECRET to .env
    # Omit subreddits to use SUBREDDIT_CONFIG defaults in reddit.py (recommended).
    # subreddits:
    #   - bostonceltics
    #   - BostonBruins
    #   - redsox
    #   - Patriots
    #   - sportsgossip
    sort: hot        # hot | new | top

  web:
    enabled: true    # scrapes WEEI, NBC Sports Boston (no login needed)

# ── Delivery ───────────────────────────────────────────────────────────────
delivery:
  channel: console   # console | slack | email

# ── Claude scoring ─────────────────────────────────────────────────────────
scoring:
  model: claude-sonnet-5
  top_n: 8           # How many stories to highlight per run
  min_score: 0.55    # Minimum score to surface (0–1); lowered to catch gossip/obscurities
  batch_size: 30     # Stories per Claude API call
