teams:
  - celtics
  - bruins
  - red_sox
  - patriots
  - revolution

# How many minutes between monitoring runs (when running in daemon mode)
schedule:
  interval_minutes: 30

# News sources to poll
sources:
  espn:
    enabled: true
  rss:
    enabled: true
    feeds:
      - https://www.espn.com/espn/rss/nba/news
      - https://www.espn.com/espn/rss/nhl/news
      - https://www.espn.com/espn/rss/mlb/news
      - https://www.espn.com/espn/rss/nfl/news
  reddit:
    enabled: false   # set to true after adding REDDIT_* env vars
    subreddits:
      - bostonceltics
      - BostonBruins
      - redsox
      - Patriots

# Where to send highlights
delivery:
  channel: console   # console | slack | email

# Claude scoring settings
scoring:
  model: claude-sonnet-5
  top_n: 5           # How many stories to highlight per run
  min_score: 0.6     # Minimum relevance score (0-1) to include
